<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c2431"/>
      <stop offset="1" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#79c0ff"/>
      <stop offset="0.55" stop-color="#4493f8"/>
      <stop offset="1" stop-color="#4493f8"/>
    </linearGradient>
  </defs>

  <!-- background tile -->
  <rect x="2" y="2" width="124" height="124" rx="28" fill="url(#bg)"/>
  <rect x="3.5" y="3.5" width="121" height="121" rx="26.5" fill="none"
        stroke="#ffffff" stroke-opacity="0.12" stroke-width="1.5"/>

  <!-- lens glass -->
  <circle cx="57" cy="57" r="29" fill="#58a6ff" fill-opacity="0.26"/>

  <!-- lens ring + handle -->
  <circle cx="57" cy="57" r="29" fill="none" stroke="url(#ring)" stroke-width="13"/>
  <line x1="80" y1="80" x2="102" y2="102" stroke="#4493f8" stroke-width="13" stroke-linecap="round"/>

  <!-- glass highlight -->
  <path d="M 41.5 62 A 18.5 18.5 0 0 1 47 45.5" fill="none" stroke="#ffffff"
        stroke-opacity="0.82" stroke-width="5" stroke-linecap="round"/>

  <!-- discovery sparkles -->
  <path d="M102 18 L104.8 27.2 L114 30 L104.8 32.8 L102 42 L99.2 32.8 L90 30 L99.2 27.2 Z" fill="#79c0ff"/>
  <path d="M112 47 L113.4 51.6 L118 53 L113.4 54.4 L112 59 L110.6 54.4 L106 53 L110.6 51.6 Z" fill="#79c0ff"/>
</svg>
